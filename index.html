<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Top Stats AIO</title>
  <script>
    console.time('index-load');
    console.time('skeleton-visible');
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>
  <style>
    :root {
      --skeleton-bg:#1e1e1e;
      --skeleton-base:#2a2a2a;
      --skeleton-highlight:#3a3a3a;
    }
    html.light {
      --skeleton-bg:#f0f0f0;
      --skeleton-base:#e0e0e0;
      --skeleton-highlight:#f5f5f5;
    }
    body { margin:0; }
    #skeleton-screen { position:fixed; inset:0; background:var(--skeleton-bg); z-index:10000; display:flex; flex-direction:column; gap:16px; padding:16px; transition:opacity 0.3s ease; }
    #skeleton-screen.hidden { opacity:0; pointer-events:none; }
    .skeleton { background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-highlight) 37%,var(--skeleton-base) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
    .skeleton-row { display:flex; align-items:center; gap:12px; }
    .skeleton-avatar { width:40px; height:40px; border-radius:50%; }
    .skeleton-line { height:12px; border-radius:4px; margin-bottom:8px; width:100%; }
    .skeleton-line.short { width:60%; }
    .skeleton-block { height:120px; border-radius:8px; width:100%; }
    @keyframes shimmer { 0% { background-position:-400px 0; } 100% { background-position:400px 0; } }
  </style>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <div id="skeleton-screen">
    <div class="skeleton-row">
      <div class="skeleton-avatar skeleton"></div>
      <div style="flex:1;">
        <div class="skeleton-line skeleton"></div>
        <div class="skeleton-line skeleton short"></div>
      </div>
    </div>
    <div class="skeleton-block skeleton"></div>
    <div class="skeleton-row">
      <div class="skeleton-avatar skeleton"></div>
      <div style="flex:1;">
        <div class="skeleton-line skeleton"></div>
        <div class="skeleton-line skeleton short"></div>
      </div>
    </div>
    <div class="skeleton-block skeleton"></div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      console.timeEnd('index-load');
      console.time('app-html-fetch');
      fetch('app.html')
        .then(r => r.text())
        .then(html => {
          console.timeEnd('app-html-fetch');
          document.body.insertAdjacentHTML('beforeend', html);
          console.time('app-css-load');
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'styles.css';
          link.onload = () => console.timeEnd('app-css-load');
          document.head.appendChild(link);
          console.time('renderer-script-load');
          const s = document.createElement('script');
          s.src = 'renderer.js';
          s.onload = () => console.timeEnd('renderer-script-load');
          document.body.appendChild(s);
        });
    });
  </script>
</body>
</html>
